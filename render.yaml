# Render Blueprint for StudyTask.
# The free web service has an ephemeral filesystem and no Shell access.
# SQLite works for a demo, but its data is lost on every restart/redeploy.
# For durable data, use a paid service with a persistent disk (see DEPLOYMENT.md).

services:
  - type: web
    name: studytask
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    # Migrations run before server.js starts. The database is recreated on each
    # cold start because the free filesystem is ephemeral.
    startCommand: npm run start:production
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: PORT
        value: '10000'
      - key: DATABASE_STORAGE
        value: /tmp/studytask.db
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: COOKIE_NAME
        value: studytask_token
      - key: BCRYPT_ROUNDS
        value: '12'
