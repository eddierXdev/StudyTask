# Render Blueprint for StudyTask.
# The free web service and free PostgreSQL plan are suitable for the course demo.
# Render free PostgreSQL databases expire 30 days after creation.

databases:
  - name: studytask-db
    databaseName: studytask
    user: studytask_app
    plan: free
    postgresMajorVersion: '18'
    region: oregon

services:
  - type: web
    name: studytask
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev
    # Free web services cannot use preDeployCommand or Shell access.
    # The production start command runs pending migrations before starting.
    startCommand: npm run start:production
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: studytask-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: COOKIE_NAME
        value: studytask_token
      - key: BCRYPT_ROUNDS
        value: '12'
